---
# yamllint configuration for this repo's own workflow YAML.
# Also published as the default config consumed by helm-validate.yml when a
# calling repo does not supply its own.
extends: default

rules:
  # GitHub Actions expressions (${{ ... }}) routinely push lines past 80.
  line-length:
    max: 120
    level: warning
  # `on:` is a GitHub Actions keyword, not the boolean `true`.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  # Workflow files conventionally omit the leading `---`.
  document-start: disable
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
