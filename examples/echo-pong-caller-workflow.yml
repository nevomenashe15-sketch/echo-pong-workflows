# =============================================================================
# ILLUSTRATIVE EXAMPLE -- NOT A LIVE WORKFLOW.
#
# This file lives under examples/ and is therefore never executed: GitHub only
# runs workflows in .github/workflows/. It shows how the echo-pong APPLICATION
# repository would wire up the reusable workflows in this repo as its own
# .github/workflows/ci.yml.
#
# Adopting it is the app repository's decision and is out of scope here. Copy,
# adjust the `uses:` owner, set the vars/secrets listed at the bottom, and
# create the `production-promotion` GitHub Environment first.
#
# PINNING: every `uses:` below points at `@v1` -- the floating major tag of this
# repo. Do NOT pin consumers at `@main`. A reusable workflow referenced by a
# branch is re-resolved on every run, so any commit to that branch changes the
# behaviour of every consumer's pipeline at once, with no review from the
# consumers and no way to roll back other than reverting the shared repo. `@v1`
# gives consumers additive, backward-compatible updates only. For an audited
# supply chain, pin to an immutable `@v1.2.3` (or a commit SHA) and bump
# deliberately.
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validation. Runs on every push and PR. No cloud credentials whatsoever.
  # ---------------------------------------------------------------------------
  ci:
    name: Go CI
    uses: nevomenashe15-sketch/echo-pong-workflows/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
    with:
      go-version: "1.24"

  # =============================================================================
  # CONTINUOUS DEV DEPLOYMENT -- every push to main, no approval gate.
  #
  # This chain exists because the tag-only release chain below (build/scan/
  # approve-promotion/promote/gitops) never runs on an ordinary push to main,
  # which meant dev's Argo CD Application -- auto-sync, no manual gate, by
  # design (see echo-pong-gitops's own sync-policy table) -- had nothing to
  # actually sync. Nothing deployed to dev, ever, until this existed.
  #
  # It reuses the SAME image-build-quarantine.yml / image-scan.yml /
  # image-promote.yml / gitops-propose-update.yml reusable workflows as the
  # release chain, not a lighter path: echo-pong-gitops's own docs state
  # quarantine grants no pull access to cluster node roles at all, so a node
  # physically cannot run a quarantine-only image -- promotion to the single
  # production `echo-pong` ECR repository is mandatory before ANY cluster,
  # dev included, can run it. The image itself is identical regardless of
  # which environment ends up running it; only the human-facing production-tag
  # is skipped here (dev deploys reference the digest, never a version tag --
  # tags are reserved for real releases, the chain below).
  #
  # What "no approval gate" actually means: no `environment:`-gated job like
  # `approve-promotion` blocks this chain from running -- but
  # gitops-propose-update.yml only ever opens a PR (see its own header: never
  # kubectl). For dev to be genuinely continuous rather than "proposed and
  # then waiting on a human to click merge," the final step below explicitly
  # enables GitHub's native auto-merge on that PR using the same GitHub App
  # credentials already granted to this repo for echo-pong-gitops -- it does
  # not bypass echo-pong-gitops's own branch protection/required-checks,
  # it just removes the need for a human to manually press the button once
  # those pass.
  # =============================================================================
  build-dev:
    name: Build (quarantine) — dev
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: nevomenashe15-sketch/echo-pong-workflows/.github/workflows/image-build-quarantine.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.AWS_ECR_RELEASE_ROLE_ARN }}
      ecr-quarantine-repository: echo-pong-quarantine
      platforms: linux/amd64,linux/arm64
      push-ghcr: true

  scan-dev:
    name: Scan (quarantine) — dev
    needs: build-dev
    uses: nevomenashe15-sketch/echo-pong-workflows/.github/workflows/image-scan.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.AWS_ECR_RELEASE_ROLE_ARN }}
      image-digest: ${{ needs.build-dev.outputs.image-digest }}
      ecr-quarantine-repository: echo-pong-quarantine
      severity: HIGH,CRITICAL

  promote-dev:
    name: Promote to production ECR — dev
    needs: scan-dev
    uses: nevomenashe15-sketch/echo-pong-workflows/.github/workflows/image-promote.yml@v1
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.AWS_ECR_RELEASE_ROLE_ARN }}
      image-digest: ${{ needs.scan-dev.outputs.scanned-digest }}
      source-repository: echo-pong-quarantine
      target-repository: echo-pong
      # No production-tag: this is not a human-facing release, only a dev
      # deploy. It still lands in the one production ECR repo (see the
      # header comment above for why) and is still signed + attested.

  gitops-dev:
    name: Propose + auto-merge GitOps update — dev
    needs: promote-dev
    uses: nevomenashe15-sketch/echo-pong-workflows/.github/workflows/gitops-propose-update.yml@v1
    permissions:
      contents: read
    with:
      gitops-repository: nevomenashe15-sketch/echo-pong-gitops
      environment: dev
      image-repository: ${{ needs.promote-dev.outputs.production-repository-uri }}
      image-digest: ${{ needs.promote-dev.outputs.production-digest }}
      chart-path: charts/echo-pong
      use-github-app: true
    secrets:
      gitops-app-id: ${{ secrets.GITOPS_APP_ID }}
      gitops-app-private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

  auto-merge-dev:
    name: Auto-merge dev GitOps PR
    needs: gitops-dev
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Independent token generation: gitops-propose-update.yml's own
      # installation token is internal to that reusable workflow and isn't
      # exposed as an output, by design (least privilege -- callers get a
      # PR URL/number, not a live credential). Auto-merging is this
      # repository's own policy choice for dev specifically, so it mints
      # its own short-lived token from the same GitHub App installation
      # rather than the reusable workflow growing an "auto-merge" input
      # that every caller would inherit regardless of environment.
      - name: Generate GitOps App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: nevomenashe15-sketch
          repositories: echo-pong-gitops

      - name: Enable auto-merge on the dev PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ needs.gitops-dev.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          # --auto respects echo-pong-gitops's own branch protection and
          # required status checks -- it queues the merge, it does not
          # force it. If required checks never pass, the PR simply never
          # merges; nothing here bypasses review requirements that repo
          # has configured.
          gh pr merge --auto --squash "${PR_URL}"

  # ---------------------------------------------------------------------------
  # 2. Build the multi-arch image into QUARANTINE. Tags only -- PRs validate but
  #    never publish, so a fork PR can never push to any registry.
  #
  #    The caller's `permissions:` block is the CEILING for the reusable
  #    workflow's jobs. id-token/packages must be granted HERE or the reusable
  #    workflow's OIDC and GHCR steps fail outright rather than skipping.
  # ---------------------------------------------------------------------------
  build:
    name: Build (quarantine)
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    uses: nevomenashe15-sketch/echo-pong-workflows/.github/workflows/image-build-quarantine.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      aws-region: ${{ vars.AWS_REGION }}
      # ARN of echo-pong-gh-ecr-release, created by echo-pong-infrastructure.
      # Held as a repository variable, not baked into any workflow file.
      aws-role-to-assume: ${{ vars.AWS_ECR_RELEASE_ROLE_ARN }}
      ecr-quarantine-repository: echo-pong-quarantine
      platforms: linux/amd64,linux/arm64
      push-ghcr: true

  # ---------------------------------------------------------------------------
  # 3. Scan EVERY architecture manifest. Fails closed on HIGH/CRITICAL, which
  #    blocks promotion because `promote` needs this job.
  # ---------------------------------------------------------------------------
  scan:
    name: Scan (quarantine)
    needs: build
    uses: nevomenashe15-sketch/echo-pong-workflows/.github/workflows/image-scan.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.AWS_ECR_RELEASE_ROLE_ARN }}
      image-digest: ${{ needs.build.outputs.image-digest }}
      # Must match `build`'s ecr-quarantine-repository above -- this is set
      # explicitly here rather than left to image-scan.yml's own default,
      # because that default happening to equal build's value is a
      # coincidence, not a guarantee: customizing build's value without also
      # updating this one would make scan look up the digest in the wrong
      # ECR repository. Setting both explicitly makes the coupling visible.
      ecr-quarantine-repository: echo-pong-quarantine
      severity: HIGH,CRITICAL

  # ---------------------------------------------------------------------------
  # 4. HUMAN APPROVAL GATE.
  #
  #    The gate is the `environment:` key, not this job's body. Configure the
  #    `production-promotion` GitHub Environment with required reviewers; the
  #    run then pauses here until a reviewer approves. The job does nothing but
  #    exist -- putting the gate on a no-op job keeps the approval decoupled
  #    from the promotion logic, so an approver is approving "promote this
  #    digest", not re-running arbitrary steps.
  #
  #    An environment gate cannot be declared on a `uses:` job together with
  #    `with:`/`secrets:` in all cases, so the gate is its own job and
  #    `promote` simply `needs:` it.
  # ---------------------------------------------------------------------------
  approve-promotion:
    name: Approve promotion to production
    needs: scan
    runs-on: ubuntu-latest
    environment: production-promotion
    permissions: {}
    steps:
      - name: Record approval
        env:
          DIGEST: ${{ needs.scan.outputs.scanned-digest }}
          PLATFORMS: ${{ needs.scan.outputs.platforms-scanned }}
        run: |
          {
            echo "### Approved for promotion"
            echo ""
            echo "Digest: \`${DIGEST}\`"
            echo ""
            echo "Scanned platforms: \`${PLATFORMS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. Promote by COPY to the production ECR repo, then sign + attest.
  #    Note the digest comes from `scan`, not from `build`: same value, but
  #    sourcing it from the gate that validated it makes the dependency on a
  #    passing scan explicit rather than incidental.
  # ---------------------------------------------------------------------------
  promote:
    name: Promote to production
    needs: [scan, approve-promotion]
    uses: nevomenashe15-sketch/echo-pong-workflows/.github/workflows/image-promote.yml@v1
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-to-assume: ${{ vars.AWS_ECR_RELEASE_ROLE_ARN }}
      image-digest: ${{ needs.scan.outputs.scanned-digest }}
      source-repository: echo-pong-quarantine
      target-repository: echo-pong
      production-tag: ${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # 6. Propose the GitOps change. Opens a PR; does not deploy. Production still
  #    requires a human to review and merge that PR before Argo CD syncs.
  # ---------------------------------------------------------------------------
  gitops:
    name: Propose GitOps update
    needs: promote
    uses: nevomenashe15-sketch/echo-pong-workflows/.github/workflows/gitops-propose-update.yml@v1
    permissions:
      contents: read
    with:
      gitops-repository: nevomenashe15-sketch/echo-pong-gitops
      environment: production
      image-repository: ${{ needs.promote.outputs.production-repository-uri }}
      image-digest: ${{ needs.promote.outputs.production-digest }}
      chart-path: charts/echo-pong
      use-github-app: true
    secrets:
      gitops-app-id: ${{ secrets.GITOPS_APP_ID }}
      gitops-app-private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

  # ---------------------------------------------------------------------------
  # 7. Binary release, in parallel with the image path -- neither blocks the
  #    other, and a binary publish failure must not strand a promoted image.
  # ---------------------------------------------------------------------------
  binaries:
    name: Binary release
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    uses: nevomenashe15-sketch/echo-pong-workflows/.github/workflows/release.yml@v1
    permissions:
      contents: write
      id-token: write
    with:
      binary-name: ping-pong-game
      platforms: '["linux/amd64","linux/arm64","darwin/arm64"]'

# =============================================================================
# PREREQUISITES in the calling repository
#
# Repository variables (vars.*) -- non-secret, but not hardcoded in YAML:
#   AWS_REGION                  e.g. eu-central-1 (matches echo-pong-infrastructure)
#   AWS_ECR_RELEASE_ROLE_ARN    ARN of echo-pong-gh-ecr-release
#
# Repository secrets:
#   GITOPS_APP_ID               GitHub App installed on echo-pong-gitops ONLY.
#   GITOPS_APP_PRIVATE_KEY      that App's private key (PEM). Used twice: by
#                                gitops-propose-update.yml (dev and prod, to
#                                open the PR) and directly by auto-merge-dev
#                                (dev only, to enable auto-merge on it).
#
# Environments:
#   production-promotion        required reviewers; gates the tag-triggered
#                                release chain's promotion to production.
#                                The dev chain has no equivalent gate --
#                                that absence is the point (see its header
#                                comment) -- so double-check this Environment
#                                is scoped to ONLY the `approve-promotion`
#                                job, never accidentally to the dev jobs.
#
# AWS side (owned by echo-pong-infrastructure):
#   echo-pong-gh-ecr-release's OIDC trust policy must cover BOTH ref patterns
#   used in this file, not just tags: refs/heads/main (the continuous dev
#   chain) AND refs/tags/v* (the release chain) -- e.g.
#   repo:<owner>/echo-pong:ref:refs/heads/main and
#   repo:<owner>/echo-pong:ref:refs/tags/v*, with no wildcard repository
#   trust either way. A role trusted for tags only will fail the dev chain's
#   AssumeRoleWithWebIdentity call with an access-denied error, not a
#   friendly one -- this is the first thing to check if build-dev fails at
#   the "Configure AWS credentials" step.
#
# echo-pong-gitops side:
#   auto-merge-dev's `gh pr merge --auto` only takes effect if that repo has
#   branch protection with required status checks configured on its default
#   branch -- without any required checks, GitHub merges the PR essentially
#   immediately, which may or may not be the intended amount of ceremony for
#   dev. This file doesn't and can't control that repo's own settings.
# =============================================================================
